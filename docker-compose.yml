services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: development
      CORS_ORIGINS: http://localhost:3000
      TYPHOON_API_KEY: ${TYPHOON_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TIKTOK_RESEARCH_API_TOKEN: ${TIKTOK_RESEARCH_API_TOKEN:-}
      TIKTOK_RESEARCH_API_BASE_URL: ${TIKTOK_RESEARCH_API_BASE_URL:-https://open.tiktokapis.com}
      TIKTOK_BROWSER_ENABLED: ${TIKTOK_BROWSER_ENABLED:-false}
      TIKTOK_BROWSER_CDP_URL: ${TIKTOK_BROWSER_CDP_URL:-}
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

  langflow:
    build:
      context: ./langflow
      dockerfile: Dockerfile
    profiles:
      - matching-lab
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      LANGFLOW_AUTO_LOGIN: ${LANGFLOW_AUTO_LOGIN:-false}
      LANGFLOW_HOST: 0.0.0.0
      LANGFLOW_PORT: "7860"
      LANGFLOW_CONFIG_DIR: /app/langflow
      LANGFLOW_COMPONENTS_PATH: /app/custom_components
      LANGFLOW_SUPERUSER: ${LANGFLOW_SUPERUSER:-langflow}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD:-}
    volumes:
      - langflow_data:/app/langflow
    depends_on:
      api:
        condition: service_healthy

volumes:
  langflow_data:
