[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kol-api"
version = "0.1.0"
description = "Thai TikTok KOL Matcher API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "rank-bm25>=0.2.2",
    "lekcut==1.0.0",
    "trafilatura>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
browser = [
    "playwright>=1.45",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]
